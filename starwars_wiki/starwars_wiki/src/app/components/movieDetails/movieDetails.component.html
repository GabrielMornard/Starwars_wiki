<div class="movie-content" *ngIf="movie != undefined">

  <div class="main-info">
    <div class="movie-img-container">
      <img class="movie-img" [src]="imgUrl" alt="{{ movie.title }}" />
    </div>
    <div class="movie-details">
      <h2 class="movie-name">{{ movie.title }}</h2>
      <div class="movie-info">
        <p class="opening-crawl">{{ movie.opening_crawl }}</p>
        <p><strong>Director:</strong> {{ movie.director }}</p>
        <p><strong>Producer:</strong> {{ movie.producer }}</p>
        <p><strong>Release date:</strong> {{ movie.release_date }}</p>
        <p><strong>Characters:</strong> {{ movie.characters }}</p>
        <p><strong>Planets:</strong> {{ movie.planets }}</p>
        <p><strong>Species:</strong> {{ movie.species }}</p>
        <p><strong>Starships:</strong> {{ movie.starships }}</p>
      </div>
    </div>
  </div>
  

</div>
